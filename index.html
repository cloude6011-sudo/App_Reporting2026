<!DOCTYPE html>
<html lang="id"><head><base target="_top"><meta charset="utf-8">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>WMS Warehouse</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--ink:#202124;--mute:#5f6368;--line:#e1e6ed;--pri:#2f6fe4;--prib:#e8f0fe;--ok:#188038;--okb:#e6f4ea;--sel:#b06000;--selb:#fef3d6;--bed:#d93025;--bedb:#fce8e6;--belb:#eef1f6;--onp:#fff;--hbg:#2f6fe4;--hfg:#fff;--hh:calc(3.3rem + env(safe-area-inset-top));--nh:calc(3.8rem + env(safe-area-inset-bottom));--sh:0 1px 3px rgba(32,33,36,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:112.5%;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 5rem)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--pri);outline:2px solid var(--prib)}
.boot{padding:3rem 1rem;text-align:center;color:var(--mute);font-size:1.1rem}
.boot button{margin-top:1rem;min-height:3rem;padding:0 1.2rem;border-radius:.8rem;border:0;background:var(--pri);color:var(--onp);font-weight:700}

.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:.5rem;height:var(--hh);padding:env(safe-area-inset-top) calc(.6rem + env(safe-area-inset-right)) 0 calc(.9rem + env(safe-area-inset-left));background:var(--hbg);color:var(--hfg)}
.bar b{font-size:1rem;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sy{flex:0 0 auto;display:flex;align-items:center;gap:.4rem;min-height:2.6rem;padding:0 .7rem;border:0;border-radius:99px;background:rgba(255,255,255,.2);color:inherit;font-size:.85rem;font-weight:500}
.sy.spin .ic{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media(max-width:400px){.sy{font-size:.78rem;gap:.3rem}}
@media(max-width:340px){.sy .lb{display:none}}
main{max-width:720px;margin:0 auto;padding:.8rem calc(.9rem + env(safe-area-inset-right)) calc(var(--nh) + 1.6rem) calc(.9rem + env(safe-area-inset-left))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -1px 4px rgba(32,33,36,.06);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
nav button{flex:1;min-height:3.9rem;border:0;background:none;padding:.3rem .1rem;font-size:.8rem;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;position:relative;font-weight:500}
nav button i{font-style:normal;font-size:1.5rem;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
nav button.on::before{content:'';position:absolute;top:.35rem;left:calc(50% - 1.6rem);width:3.2rem;height:2.1rem;border-radius:99px;background:var(--prib);z-index:-1}
nav button i,nav button{z-index:0}
nav button:active{opacity:.6}

.card,.rak,.spm,.tile,.adj,.rs,.pic,.dayr{box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.9rem;margin:.7rem 0}
.card h3{margin:0 0 .5rem;font-size:1.15rem}
h3{font-size:1.2rem;margin:.2rem 0 .5rem}
.msg{font-size:1rem;color:var(--mute);margin-bottom:1rem}
.btn{border:1px solid #c9d3e0;background:var(--card);color:var(--pri);border-radius:.7rem;min-height:3.1rem;padding:.55rem .9rem;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-weight:600;transition:transform .08s,filter .15s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97);filter:brightness(.93)}
.btn.pri{background:var(--pri);color:var(--onp);border-color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(47,111,228,.35)}
.btn.bad{background:var(--bed);color:var(--onp);border-color:var(--bed);font-weight:700}
.btn.sm{min-height:2.7rem;padding:.3rem .8rem;font-size:.9rem}
.btn.block{width:100%}
.btn.big{min-height:3.6rem;font-size:1.1rem;font-weight:700}
.btn.ok{color:var(--ok);border:1.5px solid var(--ok)}.btn.ok.on{background:var(--ok);color:var(--onp)}
.btn.no{color:var(--bed);border:1.5px solid var(--bed)}.btn.no.on{background:var(--bed);color:var(--onp)}
.btn.up{flex-direction:column;gap:.1rem;min-height:3.8rem;width:100%}
.btn.up small{font-weight:400;opacity:.9;font-size:.8rem}
.row{display:flex;gap:.5rem;margin:.5rem 0}.row>*{flex:1;min-width:0}
.row.mid{align-items:center;margin-top:0}.row.mid h3{margin:0}.row.mid .btn{flex:0 0 auto}
.grow{flex:1}
input,select,textarea{width:100%;min-height:3.1rem;border:1px solid #c9d3e0;background:var(--card);border-radius:.7rem;padding:.55rem .75rem;font-size:1rem}
select.warn{border-color:var(--sel)}
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=checkbox]{width:1.5rem;height:1.5rem;min-height:0;flex:0 0 1.5rem;accent-color:var(--pri)}
input[type=file]{padding:.5rem;font-size:.9rem}
textarea{min-height:min(52vh,26rem);font:.95rem/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;resize:vertical}
label.l{font-size:.9rem;font-weight:600;color:var(--mute);display:block;margin:.5rem 0 .25rem}
.mute{color:var(--mute);font-size:.9rem}
.bad-t{color:var(--bed);font-weight:700}.warn-t{color:var(--sel);font-weight:700}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.9rem;transition:transform .08s}
.tile:active{transform:scale(.98)}
.tile small{color:var(--mute);display:block;font-size:.9rem;font-weight:600}
.tile .num{display:block;font-size:2.1rem;font-weight:700;color:var(--pri);line-height:1.15;margin:.2rem 0}
.seg{display:flex;border:1px solid #c9d3e0;border-radius:.7rem;overflow:hidden;margin:.5rem 0;background:var(--card)}
.seg button{flex:1;min-height:3.1rem;border:0;background:none;padding:.5rem .3rem;font-weight:600}
.seg button.on{background:var(--prib);color:var(--pri);font-weight:700;box-shadow:inset 0 -3px 0 var(--pri)}
.chips{position:relative;display:flex;gap:.5rem;overflow-x:auto;padding:.25rem .9rem .6rem;margin:0 -.9rem;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;min-height:2.8rem;border:1px solid #c9d3e0;background:var(--card);border-radius:99px;padding:.4rem .95rem;font-size:.95rem;font-weight:600;scroll-snap-align:start}
.chip:active{opacity:.7}
.chip.on{background:var(--prib);color:var(--pri);border-color:var(--pri);font-weight:700}
.stk{position:sticky;top:var(--hh);z-index:4;background:var(--bg);margin:0 -.9rem;padding:.5rem .9rem 0}
.stk>.row{margin:0}.stk .chips{padding-top:.5rem}
.score{display:flex;align-items:center;gap:1rem}.big{font-size:2.6rem;font-weight:700;color:var(--pri);line-height:1}
.bar2{display:flex;height:.7rem;border-radius:.4rem;overflow:hidden;background:var(--belb);margin-top:.5rem}.bar2 i{display:block;background:var(--pri);transition:width .3s}
.k4{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin:.5rem 0}
.k4>div{background:var(--card);border:1px solid var(--line);border-radius:.7rem;box-shadow:var(--sh);padding:.6rem .75rem;font-size:.9rem;color:var(--mute)}
.k4 b{display:block;font-size:1.5rem;color:var(--ink)}

.rak{background:var(--card);border:1px solid var(--line);border-left:5px solid #b8c2cf;border-radius:.8rem;margin:.55rem 0;padding:.8rem}
.rak.sesuai{border-left-color:var(--ok);background:linear-gradient(90deg,var(--okb),var(--card) 30%)}
.rak.beda{border-left-color:var(--bed);background:linear-gradient(90deg,var(--bedb),var(--card) 30%)}
.rak.selisih{border-left-color:var(--sel);background:linear-gradient(90deg,var(--selb),var(--card) 30%)}
.rak .row{margin:.7rem 0 0}.rak>input{margin-top:.6rem}.rak .row input{margin:0}
.hd2{display:flex;justify-content:space-between;align-items:center;gap:.5rem}.hd2 b{font-size:1.3rem}
.nm{font-size:1rem;font-weight:600;margin:.15rem 0}
.qw{color:var(--ink);font-size:1.1rem}
.diff{color:var(--bed);font-weight:700;font-size:.95rem;margin-top:.4rem}
.tag{font-size:.85rem;font-weight:700;padding:.15rem .7rem;border-radius:99px;background:var(--belb);color:var(--mute);white-space:nowrap;display:inline-block}
.sesuai .tag,.p-ok{background:var(--okb);color:var(--ok)}.selisih .tag,.p-mix{background:var(--selb);color:var(--sel)}.beda .tag,.p-copy{background:var(--bedb);color:var(--bed)}
.pill{font-size:.85rem;padding:.1rem .65rem;border-radius:99px;font-weight:700;white-space:nowrap}
.prog{height:.8rem;background:var(--belb);border-radius:99px;overflow:hidden;margin:.5rem 0 .25rem}.prog>div{height:100%;background:var(--pri);transition:width .3s}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.box{border:1px solid var(--line);border-radius:.8rem;padding:.6rem}.box h4{margin:0 0 .3rem;font-size:.9rem;color:var(--mute)}
.ln{display:flex;justify-content:space-between;gap:.4rem;padding:.15rem 0;font-size:.95rem}.ln b{text-align:right}
.spm,.pic,.dayr{border:1px solid var(--line);border-radius:.9rem;padding:.7rem .8rem;margin:.5rem 0;background:var(--card)}
.spm .t,.pic .t,.dayr .t,.adj .t{display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.m{font-size:.9rem;color:var(--mute);margin-top:.15rem}
.pic.tot{background:var(--prib)}
.rs{border:1px solid var(--line);border-radius:.9rem;padding:.6rem;margin:.5rem 0}.rs .row{margin:.4rem 0}.rs>input{margin-top:.4rem}
.adj{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sel);border-radius:.8rem;padding:.65rem .8rem;margin:.5rem 0}
.adj .t b:first-child{font-size:1.15rem}.adj .t b:last-child{font-size:1.35rem}
.wk{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem;font-size:.95rem}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}

.sheet{position:fixed;inset:0;z-index:20}
.sbg{position:absolute;inset:0;background:rgba(32,33,36,.4);animation:fade .2s}
.sbody{position:absolute;left:0;right:0;bottom:0;max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:var(--bg);border-radius:1.2rem 1.2rem 0 0;padding:0 calc(.9rem + env(safe-area-inset-right)) calc(1.1rem + env(safe-area-inset-bottom)) calc(.9rem + env(safe-area-inset-left));max-width:720px;margin:0 auto;animation:up .25s ease-out;box-shadow:0 -4px 20px rgba(32,33,36,.18)}
.grab{position:sticky;top:0;z-index:2;display:flex;justify-content:center;padding:.6rem 0 .75rem;margin:0 -.9rem;touch-action:none;background:var(--bg)}
.grab span{width:2.6rem;height:.3rem;border-radius:99px;background:var(--line)}
.sfoot{position:sticky;bottom:0;background:var(--bg);margin:.6rem -.9rem calc(-1.1rem - env(safe-area-inset-bottom));padding:.6rem .9rem calc(.9rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sfoot .row{margin:0}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(var(--nh) + .9rem);transform:translateX(-50%);background:#323639;color:#fff;padding:.7rem 1.2rem;border-radius:1rem;font-size:1rem;font-weight:600;z-index:30;max-width:92%;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.row.acts{position:sticky;bottom:calc(var(--nh) + .5rem);z-index:3;background:var(--card);padding:.5rem 0;margin:.5rem 0 0;box-shadow:0 -8px 8px -8px rgba(32,33,36,.12)}
.fold{padding:.4rem .9rem}
.fold summary{cursor:pointer;list-style:none;min-height:3rem;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:1.05rem}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'▾';color:var(--mute);font-size:1.2rem}
.fold[open] summary::after{content:'▴'}
.fold[open]{padding-bottom:.9rem}
.empty{text-align:center;color:var(--mute);padding:2rem .6rem;font-size:1rem}.empty .ei{display:block;font-size:2.6rem;margin-bottom:.3rem}
.chk{display:flex;gap:.6rem;align-items:center;min-height:3rem;font-size:1rem}

/* ---- penyempurnaan UX ---- */
.sb{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.box{min-width:0;padding:.55rem .6rem}
.ln{flex-wrap:wrap;align-items:baseline}
.ln b small{font-weight:600;white-space:nowrap}
select{text-align:left;text-align-last:left}
input[type=date]{font-size:.92rem;padding:.55rem .45rem .55rem .65rem;min-width:0}
.row.acts .btn{white-space:nowrap;font-size:.9rem;padding:.4rem .25rem;gap:.3rem}
.btn.x{color:var(--bed);border-color:#f1c4c0;padding:.4rem .7rem}
.mon{display:flex;flex-direction:column;gap:.45rem;margin:.4rem 0 .2rem}
.mon>div{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border-radius:.7rem;background:var(--belb);font-size:.95rem;line-height:1.35}
.mon>div i{font-style:normal;flex:0 0 1.4rem;font-size:1.1rem;line-height:1.3}
.mon>div.g{background:var(--okb)}.mon>div.w{background:var(--selb)}.mon>div.r{background:var(--bedb)}
.mon b{display:block;font-size:.8rem;color:var(--mute);font-weight:600;letter-spacing:.02em}

/* ===== REDESIGN v2: bersih, terang, task-first ===== */
:root{--bg:#f6f8fc;--pri:#1a6cf0;--prib:#e8f0fe;--line:#e4e9f1;--sh:0 1px 2px rgba(20,30,50,.06),0 4px 12px rgba(20,30,50,.04);--hbg:#fff;--hfg:#1f2937}
html{font-size:106%}
.bar{background:var(--hbg);color:var(--hfg);border-bottom:1px solid var(--line);box-shadow:none}
.bar b{font-size:1.2rem;font-weight:700;letter-spacing:-.01em}
.sy{background:var(--prib);color:var(--pri);font-weight:600}
main{padding-top:.4rem}
.card,.tile,.k4>div{border:0;border-radius:1.1rem;box-shadow:var(--sh)}
.card{padding:1rem;margin:.75rem 0}
.card h3{font-size:1.1rem;font-weight:700}
.btn{border:1.5px solid var(--line);border-radius:.9rem;min-height:3.2rem;color:var(--ink);font-weight:600}
.btn.pri{box-shadow:0 2px 8px rgba(26,108,240,.3)}
.rak .btn.ok,.rak .btn.no{min-height:3.5rem;font-size:1.05rem;border-width:2px}
input,select,textarea{border:1.5px solid var(--line);border-radius:.9rem;background:#fff}
nav{border:0;box-shadow:0 -2px 16px rgba(20,30,50,.08);border-radius:1.2rem 1.2rem 0 0}
nav button{min-height:3.8rem;font-size:.75rem;font-weight:600}
nav button i{font-size:1.45rem}
nav button.on{font-weight:700}
.hero{padding:.8rem .2rem .2rem}
.hero small{color:var(--mute);font-weight:600}
.hero h2{margin:.1rem 0;font-size:1.6rem;letter-spacing:-.02em}
.hero p{margin:0;color:var(--mute)}
.tile{padding:1rem;display:block;width:100%}
.tile .prog{margin:.4rem 0}
.todo{display:flex;align-items:center;gap:.7rem;width:100%;min-height:3.4rem;padding:.6rem .8rem;margin:.4rem 0;border:0;border-radius:.9rem;background:var(--selb);color:var(--ink);text-align:left;font-weight:600}
.todo i{font-style:normal;font-size:1.3rem}.todo span{flex:1}.todo::after{content:'›';font-size:1.5rem;color:var(--mute)}
.todo.done{background:var(--okb)}.todo.done::after{content:''}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin:.75rem 0}
.qa button{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.8rem .2rem;border:0;border-radius:1rem;background:#fff;box-shadow:var(--sh);font-size:.85rem;font-weight:600;color:var(--ink);min-height:4.6rem}
.qa i{font-style:normal;font-size:1.6rem}
.seg{border:0;background:#e9eef6;padding:.2rem;border-radius:.9rem}
.seg button{border-radius:.7rem;min-height:2.8rem}
.seg button.on{background:#fff;color:var(--pri);box-shadow:var(--sh)}
.chip{border:0;background:#fff;box-shadow:var(--sh)}
.chip.on{background:var(--pri);color:#fff}
.rak{border:0;border-radius:1.1rem;box-shadow:var(--sh)}
/* ===== REDESIGN v3: gaya daftar notifikasi (rata, rapi, hairline) ===== */
:root{--bg:#f3f2ef;--ink:#191919;--mute:#666;--line:#e0e0e0;--pri:#0a66c2;--prib:#dbe9f7;--grn:#01754f;--unr:#dbe9f7}
.bar{gap:.7rem;justify-content:flex-start;padding-left:calc(.8rem + env(safe-area-inset-left))}
.bar b{flex:1;font-size:1.15rem;font-weight:700}
.av{flex:0 0 auto;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid #fff;outline:1px solid var(--line);background:var(--grn);color:#fff;font-weight:700;font-size:1.1rem}
.sy{width:2.7rem;min-height:2.7rem;padding:0;justify-content:center;background:transparent;font-size:1.3rem}.sy .lb{display:none}
.card{margin:.5rem -.9rem 0;border-radius:0;box-shadow:none;border-width:1px 0;border-style:solid;border-color:var(--line);padding:.9rem}
.fold{padding:.4rem .9rem}
.btn{border-radius:99px;border:1px solid #666;color:#444;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:none}
.btn.bad{border-radius:99px}.btn.x{border-color:#e7b9b5}
.chip,.seg button{border:1px solid #666;background:#fff;color:var(--ink);box-shadow:none;font-weight:500}
.chip.on,.seg button.on{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:600;box-shadow:none}
.seg{background:none;padding:0;gap:.5rem;border:0}.seg button{border-radius:99px;min-height:2.7rem}
.stk{background:#fff;border-bottom:1px solid var(--line)}
nav{border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
nav button i{filter:grayscale(1);opacity:.55}nav button{color:var(--mute);font-weight:500}
nav button.on{color:var(--ink);font-weight:600}nav button.on i{filter:none;opacity:1}
nav button.on::before{top:0;left:18%;right:18%;width:auto;height:3px;border-radius:0;background:var(--ink)}
.rak,.spm,.pic,.dayr,.adj,.rs{margin:0 -.9rem;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:#fff;padding:.9rem .9rem .9rem 1.6rem;position:relative}
.rak.belum,.todo{background:var(--unr)}
.rak.belum::before,.todo::before{content:'';position:absolute;left:.55rem;top:1.35rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--pri)}
.rak.sesuai{background:#fff}.rak.beda{background:#fdecea}.rak.selisih{background:#fff6e0}
.rak.sesuai::before,.rak.beda::before,.rak.selisih::before{content:none}
.tag,.pill{font-weight:600}
.todo{margin:0 -.9rem;border-radius:0;border-bottom:1px solid #c5d6ea;padding-left:1.6rem;position:relative;min-height:3.6rem}
.todo::before{top:50%;margin-top:-.3rem}
.todo.done{background:#fff}.todo.done::before{content:none}
.tile,.qa button,.k4>div,.box{box-shadow:none;border:1px solid var(--line);border-radius:.8rem}
.hero{padding:.9rem 0 .3rem}
input,select,textarea{border:1px solid #8c8c8c;border-radius:.6rem}
/* ===== v4: ukuran lebih ringkas (Cek Rak & global) ===== */
.btn{min-height:2.8rem;font-size:.95rem;padding:.35rem .8rem}
.btn.sm{min-height:2.4rem;font-size:.85rem}
input,select,textarea{min-height:2.8rem;font-size:.95rem;padding:.4rem .7rem}
.seg button{min-height:2.4rem;font-size:.9rem;padding:.25rem .4rem;font-weight:600}
.chip{min-height:2.3rem;font-size:.85rem;padding:.2rem .8rem}
.big,.score .big{font-size:2rem}
.card h3,h3{font-size:1.05rem}
.rak{padding:.65rem .8rem .65rem 1.4rem}
.rak.belum::before{top:1.05rem}
.hd2 b{font-size:1.1rem}
.rak .nm{font-size:.92rem;line-height:1.3;margin:.1rem 0}

   o.qs.add(r.qtySpm);o.qtySpm=Math.max(o.qtySpm,r.qtySpm);o.qtyMuat+=r.qtyMuat;o.picQ[r.pic]=(o.picQ[r.pic]||0)+r.qtyMuat;if(r.rak)o.rq[r.rak]=(o.rq[r.rak]||0)+r.qtyMuat;if(!o.lok&&r.lok)o.lok=r.lok;

/* ---------- CLEARING: cocokkan No Voucher (7 angka) hasil import dengan tab CLEARING ---------- */
let CL={data:null,busy:false,err:'',imp:null,fn:'',col:-1,manual:false,dcol:-1,dman:false,sv:{},tg:null,tgAsked:false,f:'all',q:'',lim:60,loaded:false};
const v7=x=>{const m=String(x==null?'':x).trim().match(/^(\d{7})/);return m?m[1]:''};
const tglMs=x=>{x=String(x==null?'':x).trim();if(!x)return null;let y,m,d,mm=x.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
 if(mm){y=+mm[1];m=+mm[2];d=+mm[3]}else if(mm=x.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){d=+mm[1];m=+mm[2];y=+mm[3];if(y<100)y+=2000}else return null;
 if(m<1||m>12||d<1||d>31)return null;const t=x.match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);return Date.UTC(y,m-1,d,t?+t[1]:0,t?+t[2]:0,t?+(t[3]||0):0)};
function clAutoD(){const d=CL.data;if(!d||!d.headers||!d.headers.length){CL.dcol=-1;return}if(CL.dman&&CL.dcol>=0)return;
 let i=d.headers.findIndex((h,c)=>c!==CL.col&&/tgl|tanggal|date/i.test(h));
 if(i<0){let best=0;d.headers.forEach((h,c)=>{if(c===CL.col)return;let n=0;d.rows.forEach(r=>{if(tglMs(r[c])!=null)n++});if(n>best&&n>=d.rows.length*.5){best=n;i=c}})}
 CL.dcol=i}
function clAuto(){const d=CL.data;if(!d||!d.headers||!d.headers.length){CL.col=-1;return}if(CL.manual&&CL.col>=0)return;
 let i=d.headers.findIndex(h=>/voucher/i.test(h)&&/7|angka/i.test(h));if(i<0)i=d.headers.findIndex(h=>/voucher/i.test(h));
 if(i<0&&CL.imp){let best=0;d.headers.forEach((h,c)=>{let n=0;d.rows.forEach(r=>{if(CL.imp.map[v7(r[c])])n++});if(n>best){best=n;i=c}})}
 CL.col=i;clAutoD()}
function clLoad(refresh){if(!GS){CL.err='Data CLEARING hanya tersedia saat tersambung ke Apps Script';emit();return}
 CL.busy=true;CL.err='';emit();
 GS.withSuccessHandler(r=>{CL.busy=false;CL.data=r;CL.loaded=true;clAuto();if(refresh)toast(r.msg||'Data CLEARING diperbarui');emit()})
  .withFailureHandler(e=>{CL.busy=false;CL.loaded=true;CL.err=String(e&&e.message||e);emit()}).clearingData(!!refresh)}
async function clImport(f){if(!f)return;
 try{await need('xlsx');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',raw:true});let aoa=[],hi=-1;
  for(const n of wb.SheetNames){aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:'',raw:true});hi=aoa.findIndex(r=>r.some(c=>/^no\.?\s*voucher$/i.test(String(c).trim())));if(hi>=0)break}
  if(hi<0)return toast('Kolom "No Voucher" tidak ditemukan di file');
  const H=aoa[hi].map(c=>String(c).trim()),ix=n=>H.findIndex(h=>h.toLowerCase()===n.toLowerCase()),cv=ix('No Voucher');
  const pick=['Kode Item','Nama Item','Qty','Status Voucher','Posisi','Rak','Tgl','Shift','Mesin'].filter(k=>ix(k)>=0);
  const list=[],map={};let bad=0,dup=0;
  aoa.slice(hi+1).forEach(r=>{const raw=r[cv];if(raw===''||raw==null)return;const v=v7(raw);if(!v){bad++;return}
   if(map[v]){dup++;return}
   const o={v};pick.forEach(k=>{const j=ix(k);o[k]=String(r[j]==null?'':r[j])});map[v]=o;list.push(o)});
  CL.imp={list,map,bad,dup,cols:pick};CL.sv={};CL.fn=f.name;CL.f='all';CL.q='';CL.lim=60;CL.manual=false;clAuto();emit();
  toast(list.length+' voucher dibaca'+(bad?' · '+bad+' baris bukan 7 angka':'')+(dup?' · '+dup+' dobel digabung':''))}
 catch(e){toast('Gagal membaca file: '+(e.message||e))}}
function clMatch(){const d=CL.data,I=CL.imp;const newest=a=>{let b=a[a.length-1],bt=CL.dcol>=0?tglMs(d.rows[b][CL.dcol]):null;if(CL.dcol<0)return b;a.forEach(i=>{const t=tglMs(d.rows[i][CL.dcol]);if(t!=null&&(bt==null||t>=bt)){b=i;bt=t}});return b};if(!I||!d||CL.col<0||!I.list.length)return null;
 const M2={};d.rows.forEach((r,i)=>{const v=v7(r[CL.col]);if(v)(M2[v]=M2[v]||[]).push(i)});
 const ok=[],no=[];I.list.forEach(o=>{const hit=M2[o.v];(hit?ok:no).push({k:hit?'ok':'no',o,v:o.v,rows:hit?[newest(hit)]:[],dup:hit?hit.length:0})});
 let lo=Infinity,hi=-Infinity;I.list.forEach(o=>{const n=+o.v;if(n<lo)lo=n;if(n>hi)hi=n});
 const of=[];Object.keys(M2).forEach(v=>{if(!I.map[v]&&+v>=lo&&+v<=hi)of.push({k:'of',o:null,v,rows:[newest(M2[v])],dup:M2[v].length})});of.sort((a,b)=>b.v-a.v);
 return{ok,no,of,n:Object.keys(M2).length}}
async function clExport(){const m=clMatch();if(!m)return;try{await need('xlsx')}catch(e){return toast(e.message)}
 const d=CL.data,I=CL.imp,H=d.headers,hdr=['Status','No Voucher',...I.cols,'Jumlah baris di CLEARING (dipakai tanggal terakhir)',...H.map(h=>'CLEARING: '+h)];
 const row=(st,x)=>{const r0=x.rows.length?d.rows[x.rows[0]]:H.map(()=>'');return[st,x.v,...I.cols.map(k=>x.o?x.o[k]:''),x.dup||0,...r0]};
 const aoa=[hdr,...m.no.map(x=>row('Belum di CLEARING',x)),...m.ok.map(x=>row('Cocok',x)),...m.of.map(x=>row('Hanya di CLEARING',x))];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Clearing');
 const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'}),url=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');
 a.href=url;a.download='Cocok Clearing '+today()+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}

 const tot=m.ok.length+m.no.length,L=waHead('LAPORAN CLEARING VOUCHER',`File : ${CL.fn||'-'}`);
 L.push('*A. HASIL PENCOCOKAN*','```',padR('Voucher laporan',20)+padL(tot,7),padR('Sudah di CLEARING',20)+padL(m.ok.length,7),padR('Belum di CLEARING',20)+padL(m.no.length,7),'-'.repeat(27),padR('% Cocok',20)+padL(pct1(m.ok.length,tot),7),'```','');
 const it=o=>[o.v,o['Nama Item']||o['Kode Item'],o.Qty?'Qty '+fmt(Number(o.Qty)||0):''].filter(Boolean).join(' | ');

 L.push(`*B. BELUM DI CLEARING (${m.no.length})*`);

  ${m?html`<div className="cs"><span><b>${tot}</b>voucher</span><span className="g"><b>${m.ok.length}</b>cocok · ${pct1(m.ok.length,tot)}</span><span className=${m.no.length?'r':'g'}><b>${m.no.length}</b>belum di CLEARING</span><span><b>${m.of.length}</b>hanya di CLEARING</span></div>

function TgSheet(){const [f,setF]=useState({token:'',chats:'',on:false,mask:'',has:false,load:true}),[msg,setMsg]=useState(''),[busy,setBusy]=useState(false),[found,setFound]=useState([]);
 const call=(fn,arg,ok)=>{if(!GS){setMsg('Hanya tersedia saat tersambung ke Apps Script');return}setBusy(true);setMsg('Memproses…');
  const g=GS.withSuccessHandler(r=>{setBusy(false);ok(r)}).withFailureHandler(e=>{setBusy(false);setMsg('Gagal: '+String(e&&e.message||e).replace(/^Error:\s*/,''))});arg===undefined?g[fn]():g[fn](arg)};
 const load=()=>call('tgAppGet',undefined,c=>{setMsg('');setF(x=>({...x,chats:c.chats,on:c.on,mask:c.tokenMask,has:c.hasToken,load:false}))});
 useEffect(()=>{if(!GS){setMsg('Hanya tersedia saat tersambung ke Apps Script');setF(x=>({...x,load:false}));return}load()},[]);
 const save=()=>call('tgAppSave',{token:f.token,chats:f.chats,on:f.on},r=>{setMsg(r);CL.tgAsked=false;clTgLoad();GS.withSuccessHandler(c=>setF(x=>({...x,token:'',chats:c.chats,on:c.on,mask:c.tokenMask,has:c.hasToken}))).tgAppGet()});
 const test=()=>call('tgAppTest',undefined,r=>setMsg(r));
 const find=()=>call('tgAppFind',undefined,a=>{setFound(a||[]);setMsg(a&&a.length?'Ketuk chat untuk menambahkan:':'Belum ada chat. Kirim pesan ke bot (atau tambahkan bot ke grup lalu kirim pesan), kemudian coba lagi.')});
 const add=id=>setF(x=>{const l=x.chats.split(/[,\s;]+/).filter(Boolean);if(!l.includes(id))l.push(id);return{...x,chats:l.join(', ')}});

  <label className="l">Chat ID <span className="mute">(pisahkan koma untuk beberapa chat)</span></label><input value=${f.chats} placeholder="-1001234567890, 987654321" onInput=${e=>{const v=e.target.value;setF(x=>({...x,chats:v}))}}/>
  ${found.length?html`<div className="chips" style=${{margin:'.3rem 0 0',padding:'0 0 .3rem'}}>${found.map(c=>html`<button key=${c.id} className="chip" onClick=${()=>add(c.id)}>${(c.title||c.id)+' ('+c.type+')'}</button>`)}</div>`:null}

  <div className="cact"><button className="btn pri" disabled=${busy||f.load} onClick=${save}>Simpan</button><button className="btn" disabled=${busy||f.load} onClick=${test}>Kirim tes</button><button className="btn" disabled=${busy||f.load} onClick=${find}>Cari Chat ID</button></div>
  ${msg?html`<div className="mute" role="status" style=${{whiteSpace:'pre-wrap',margin:'.3rem 0'}}>${msg}</div>`:null}
  <div className="row"><button className="btn" onClick=${closeSheet}>Tutup</button></div><//>`}
